# Application ID
appId: com.numara.app

# Artifact name pattern
artifactName: '${productName}-${version}-${arch}.${ext}'

# Archive compression level
compression: maximum

# Publish configuration
publish:
  - provider: github
    releaseType: release

# Directories configuration
directories:
  buildResources: build/assets
  output: 'dist/${version}/${os}'

# Files to include in the build
files:
  - build
  - src/electron/**/*
  - '!**/*.map'
  - '!build/sw.js'
  - '!build/numara.webmanifest'
  - '!build/assets/background.png'
  - '!build/assets/icon.icns'
  - '!build/assets/numara.png'
  - '!build/assets/icon-192.png'
  - '!build/assets/icon-512.png'
  - '!build/assets/icon-maskable-*.png'
  - '!build/assets/apple-touch-icon.png'

# Linux configuration
linux:
  category: Utility
  syncDesktopName: true
  files:
    - '!build/assets/icon.ico'
    - '!build/assets/trayTemplate*.png'
  target:
    - AppImage
    - deb
    - rpm

# AppImage configuration
appImage:
  compression: gzip

# macOS configuration
mac:
  category: public.app-category.utilities
  entitlements: src/misc/entitlements.mac.plist
  entitlementsInherit: src/misc/entitlements.mac.plist
  hardenedRuntime: true
  files:
    - '!build/assets/icon.ico'
    - '!build/assets/icon.png'

# Windows configuration
win:
  files:
    - '!build/assets/icon.png'
    - '!build/assets/trayTemplate*.png'
  azureSignOptions:
    publisherName: 'Timur Atalay'
    endpoint: 'https://wus.codesigning.azure.net'
    certificateProfileName: 'NumaraCertProfile'
    codeSigningAccountName: 'Numara'

# NSIS installer configuration
nsis:
  deleteAppDataOnUninstall: true
  oneClick: false

# File associations configuration
fileAssociations:
  - ext: num
    name: Numara Document
    role: Editor
    description: Numara calculation file
    mimeType: application/x-numara
